<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Veda Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-checkout bg-light">

  <nav class="nav scrolled" id="main-nav">
    <div class="container nav__container">
      <div class="nav__brand"><a href="index.html">Veda Care</a></div>
      <div class="nav__links">
        <a href="cart.html" class="nav__link">&larr; Back to Cart</a>
      </div>
    </div>
  </nav>

  <main id="smooth-wrapper">
    <div id="smooth-content">
      
      <section class="section pt-100">
        <div class="container booking-grid"> <!-- Reusing grid layout -->
          
              <!-- Checkout Form -->
          <div class="checkout-form glass-card p-3">
            <h2 class="heading-lg mb-4">Checkout</h2>
            
            <form id="checkout-form" class="custom-form">
              <!-- Contact -->
              <div class="form-group mb-4 border-bottom pb-4">
                <h3 class="mb-3">Contact Information</h3>
                <label>Email Address</label>
                <input type="email" class="form-control" required>
              </div>

              <!-- Shipping -->
              <div class="form-group mb-4 border-bottom pb-4">
                <h3 class="mb-3">Shipping Address</h3>
                <div class="form-row">
                  <div class="form-group"><label>First Name</label><input type="text" id="chk-fname" class="form-control" required></div>
                  <div class="form-group"><label>Last Name</label><input type="text" id="chk-lname" class="form-control" required></div>
                </div>
                <div class="form-group"><label>Address</label><input type="text" id="chk-address" class="form-control" required></div>
                <div class="form-row">
                  <div class="form-group"><label>City</label><input type="text" id="chk-city" class="form-control" required></div>
                  <div class="form-group"><label>Postal Code</label><input type="text" class="form-control" required></div>
                </div>
              </div>

              <!-- Payment Simulation -->
              <div class="form-group mb-4">
                <h3 class="mb-3">Payment</h3>
                <p class="text-sm text-lt mb-3">All transactions are secure and encrypted.</p>
                <div class="glass-card p-3 border">
                  <div class="form-group"><label>Card Number</label><input type="text" id="chk-card" placeholder="XXXX XXXX XXXX XXXX" class="form-control" required></div>
                  <div class="form-row">
                    <div class="form-group"><label>Expiration Date</label><input type="text" placeholder="MM/YY" class="form-control" required></div>
                    <div class="form-group"><label>Security Code (CVV)</label><input type="text" placeholder="123" class="form-control" required></div>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn--primary btn--full mt-4">Complete Secure Order</button>
            </form>
          </div>

          <!-- Checkout Summary -->
          <div class="checkout-summary bg-dark text-light glass-card p-3" style="position: sticky; top: 120px;">
            <h3 class="mb-4 text-gold">Order Summary</h3>
            <div class="full-cart-items mb-4" style="max-height: 300px; overflow-y: auto;">
              <!-- JS Populates this -->
            </div>
            
            <div class="border-top pt-4">
              <div class="d-flex justify-between mb-2">
                <span>Subtotal</span>
                <span id="checkout-subtotal">$0.00</span>
              </div>
              <div class="d-flex justify-between mb-2">
                <span>Tax (5%)</span>
                <span id="checkout-tax">$0.00</span>
              </div>
              <div class="d-flex justify-between mb-4">
                <span>Shipping</span>
                <span id="checkout-shipping">$0.00</span>
              </div>
              <div class="d-flex justify-between text-gold" style="font-size: 1.25rem; font-weight: 600;">
                <span>Total</span>
                <span id="checkout-total">$0.00</span>
              </div>
            </div>
          </div>
          
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
