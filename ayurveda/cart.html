<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | Veda Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-cart bg-light">

  <!-- Navigation -->
  <nav class="nav scrolled" id="main-nav">
    <div class="container nav__container">
      <div class="nav__brand"><a href="index.html">Veda Care</a></div>
      <div class="nav__links">
        <a href="shop.html" class="nav__link">Shop</a>
        <a href="account.html" class="nav__link">Account</a>
      </div>
    </div>
  </nav>

  <main id="smooth-wrapper">
    <div id="smooth-content">
      
      <section class="section pt-100">
        <div class="container max-w-800">
          <h1 class="heading-lg mb-4 text-center">Shopping Cart</h1>
          
          <div class="cart-layout">
            <div class="cart-items-container glass-card mb-4 p-3 full-cart-items">
              <!-- JS Populates this -->
            </div>
            
            <div class="cart-summary glass-card p-3">
              <h3>Order Summary</h3>
              <div class="d-flex justify-between mt-3 mb-2">
                <span>Subtotal</span>
                <span class="cart-subtotal">$0.00</span>
              </div>
              <p class="text-sm text-lt mb-4">Taxes and shipping calculated at checkout.</p>
              
              <a href="checkout.html" class="btn btn--primary btn--full">Proceed to Checkout</a>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
