<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Consultation | Veda Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-consultation bg-light">

  <!-- Navigation -->
  <nav class="nav scrolled" id="main-nav">
    <div class="container nav__container">
      <div class="nav__brand"><a href="index.html">Veda Care</a></div>
      <div class="nav__links">
        <a href="index.html#story" class="nav__link">Our Story</a>
        <a href="shop.html" class="nav__link">Shop</a>
        <a href="index.html#testimonials" class="nav__link">Reviews</a>
      </div>
    </div>
  </nav>

  <main id="smooth-wrapper">
    <div id="smooth-content">
      
      <section class="section pt-100">
        <div class="container">
          <div class="booking-grid">
            
            <!-- Booking Info Sidebar -->
            <div class="booking-info bg-dark text-light glass-card">
              <img src="images/doctor_portrait_1784539643043.png" alt="Dr. Sharma" class="booking-doc-img rounded mb-4">
              <h2 class="heading-lg">Consult Dr. Sharma</h2>
              <p>45-minute comprehensive Ayurvedic diagnosis.</p>
              
              <div class="consultation-types mt-4">
                <label class="c-type-card active">
                  <input type="radio" name="ctype" checked>
                  <span class="c-icon">💻</span>
                  <div class="c-type-text">
                    <strong>Video Call</strong>
                    <span>Available Worldwide</span>
                  </div>
                </label>
                <label class="c-type-card">
                  <input type="radio" name="ctype">
                  <span class="c-icon">🏥</span>
                  <div class="c-type-text">
                    <strong>Clinic Visit</strong>
                    <span>New Delhi, India</span>
                  </div>
                </label>
              </div>
            </div>

            <!-- Booking Calendar & Form -->
            <div class="booking-interface">
              
              <!-- Step 1: Calendar -->
              <div class="booking-step active" id="step-calendar">
                <h3>Select Date & Time</h3>
                
                <div class="calendar-wrapper mt-4">
                  <div class="calendar-header">
                    <button class="btn-icon">&lt;</button>
                    <h4>August 2026</h4>
                    <button class="btn-icon">&gt;</button>
                  </div>
                  <div class="calendar-grid">
                    <div class="cal-day-name">Sun</div><div class="cal-day-name">Mon</div><div class="cal-day-name">Tue</div><div class="cal-day-name">Wed</div><div class="cal-day-name">Thu</div><div class="cal-day-name">Fri</div><div class="cal-day-name">Sat</div>
                    
                    <!-- Empty slots for alignment -->
                    <div class="cal-day disabled"></div><div class="cal-day disabled"></div><div class="cal-day disabled"></div><div class="cal-day disabled"></div>
                    
                    <div class="cal-day">1</div><div class="cal-day">2</div><div class="cal-day">3</div>
                    <div class="cal-day">4</div><div class="cal-day">5</div><div class="cal-day">6</div><div class="cal-day">7</div><div class="cal-day">8</div><div class="cal-day">9</div><div class="cal-day">10</div>
                    <div class="cal-day">11</div><div class="cal-day active">12</div><div class="cal-day">13</div><div class="cal-day">14</div><div class="cal-day">15</div><div class="cal-day">16</div><div class="cal-day">17</div>
                  </div>
                </div>

                <div class="time-slots mt-5">
                  <h4>Available on Aug 12</h4>
                  <div class="slots-grid mt-3">
                    <button class="slot-btn">09:00 AM</button>
                    <button class="slot-btn">10:30 AM</button>
                    <button class="slot-btn active">02:00 PM</button>
                    <button class="slot-btn">03:30 PM</button>
                    <button class="slot-btn">05:00 PM</button>
                  </div>
                </div>

                <div class="mt-5 text-right">
                  <button class="btn btn--primary" onclick="document.getElementById('step-calendar').classList.remove('active'); document.getElementById('step-details').classList.add('active');">Continue &rarr;</button>
                </div>
              </div>

              <!-- Step 2: Details Form -->
              <div class="booking-step" id="step-details">
                <h3>Patient Details</h3>
                <div class="booking-summary mt-3 mb-4 p-3 bg-light rounded border">
                  <strong>Video Call</strong> on <strong>Aug 12, 2026 at 02:00 PM</strong>
                  <button class="btn-link ml-3" onclick="document.getElementById('step-details').classList.remove('active'); document.getElementById('step-calendar').classList.add('active');">Edit</button>
                </div>

                <form class="custom-form">
                  <div class="form-row">
                    <div class="form-group">
                      <label>First Name</label>
                      <input type="text" class="form-control" required>
                    </div>
                    <div class="form-group">
                      <label>Last Name</label>
                      <input type="text" class="form-control" required>
                    </div>
                  </div>
                  <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label>Primary Health Concern</label>
                    <textarea class="form-control" rows="3" required></textarea>
                  </div>
                  <button type="button" class="btn btn--primary btn--full mt-4">Confirm Booking</button>
                </form>
              </div>

            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
