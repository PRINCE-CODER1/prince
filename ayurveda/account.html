<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Veda Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-account bg-light">

  <nav class="nav scrolled" id="main-nav">
    <div class="container nav__container">
      <div class="nav__brand"><a href="index.html">Veda Care</a></div>
      <div class="nav__links">
        <a href="shop.html" class="nav__link">Shop</a>
        <a href="cart.html" class="nav__link">Cart</a>
      </div>
    </div>
  </nav>

  <main id="smooth-wrapper">
    <div id="smooth-content">
      
      <section class="section pt-100">
        <div class="container max-w-800">
          
          <div class="d-flex justify-between align-center mb-5 border-bottom pb-3">
            <h1 class="heading-lg m-0">Welcome, Prince</h1>
            <a href="index.html" class="btn-link">Logout</a>
          </div>

          <div class="account-tabs tabs-header mb-4">
            <button class="tab-btn active" data-tab="orders">Order History</button>
            <button class="tab-btn" data-tab="consultations">Consultations</button>
            <button class="tab-btn" data-tab="settings">Account Details</button>
          </div>

          <div class="tabs-content">
            <!-- Orders -->
            <div class="tab-pane active" id="tab-orders">
              <div class="glass-card p-3 border mb-3">
                <div class="d-flex justify-between align-center mb-3">
                  <strong>Order #VC-8492</strong>
                  <span class="badge badge--glass">Delivered</span>
                </div>
                <p class="text-sm text-lt mb-3">Placed on July 15, 2026</p>
                <div class="d-flex align-center gap-3">
                  <img src="images/herbs_collection_1784539652170.png" style="width:50px; border-radius:4px;" alt="Product">
                  <div>
                    <p class="m-0 font-weight-500">Ashwagandha Gold (x2)</p>
                    <p class="m-0 text-sm">$70.00</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Consultations -->
            <div class="tab-pane" id="tab-consultations">
              <div class="glass-card p-3 border">
                <div class="d-flex align-center gap-3 mb-3">
                  <span class="c-icon" style="width:40px;height:40px;font-size:1.2rem;">💻</span>
                  <div>
                    <strong>Video Consultation</strong>
                    <p class="m-0 text-sm text-lt">with Dr. Sharma</p>
                  </div>
                </div>
                <div class="p-3 bg-cream rounded border">
                  <p class="m-0">Scheduled for: <strong>Aug 12, 2026 at 02:00 PM</strong></p>
                  <a href="#" class="btn-link text-sm mt-2 block">Join Meeting Link</a>
                </div>
              </div>
            </div>

            <!-- Settings -->
            <div class="tab-pane" id="tab-settings">
              <form class="custom-form glass-card p-3 border">
                <div class="form-row">
                  <div class="form-group"><label>First Name</label><input type="text" class="form-control" value="Prince"></div>
                  <div class="form-group"><label>Last Name</label><input type="text" class="form-control" value="Kumar"></div>
                </div>
                <div class="form-group"><label>Email Address</label><input type="email" class="form-control" value="prince@example.com"></div>
                <button type="button" class="btn btn--primary mt-3">Update Profile</button>
              </form>
            </div>
          </div>

        </div>
      </section>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/main.js"></script>
  <!-- Reuse Tab Logic -->
  <script>
    document.querySelectorAll('.account-tabs .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.account-tabs .tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tabs-content .tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.getAttribute('data-tab')}`).classList.add('active');
      });
    });
  </script>
</body>
</html>
