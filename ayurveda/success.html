<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | Veda Care</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-success bg-light">

  <nav class="nav scrolled" id="main-nav">
    <div class="container nav__container">
      <div class="nav__brand"><a href="index.html">Veda Care</a></div>
      <div class="nav__links">
        <a href="shop.html" class="nav__link">Continue Shopping</a>
        <a href="account.html" class="nav__link">My Account</a>
      </div>
    </div>
  </nav>

  <main id="smooth-wrapper">
    <div id="smooth-content">
      
      <section class="section pt-100" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="container max-w-600 text-center">
          
          <div class="success-icon mb-4" style="font-size: 4rem; color: var(--c-gold);">✨</div>
          <h1 class="heading-lg mb-3">Thank You For Your Order!</h1>
          <p class="text-lead mb-5">Your order <strong>#VC-9831</strong> has been placed successfully. A confirmation email has been sent to you.</p>
          
          <div class="glass-card p-3 border mb-5 text-left">
            <h3 class="mb-3">Order Status</h3>
            <div class="timeline-mini">
              <div class="timeline-item">
                <div class="timeline-dot" style="background: var(--c-forest);"></div>
                <h4>Order Placed</h4>
                <p>We have received your order.</p>
              </div>
              <div class="timeline-item">
                <div class="timeline-dot" style="background: transparent; border-color: rgba(0,0,0,0.1);"></div>
                <h4 style="color: rgba(0,0,0,0.4);">Preparing for Shipment</h4>
                <p style="color: rgba(0,0,0,0.4);">Usually within 24 hours.</p>
              </div>
            </div>
          </div>

          <a href="shop.html" class="btn btn--primary">Return to Shop</a>
          
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Clear cart upon successful order
    if(window.cart) {
      window.cart.items = [];
      window.cart.save();
    }
  </script>
</body>
</html>
